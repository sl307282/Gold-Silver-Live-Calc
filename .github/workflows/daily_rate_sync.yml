name: Gold & Silver API Daily Sync

on:
  schedule:
    # Strictly ONLY ONE TIME PER DAY at 9:00 AM IST (3:30 AM UTC)
    # Minimizes API quota consumption to just 1 run per day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI when needed

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd firestore-sync
          npm install

      - name: Create Credentials and Sync Rates
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd firestore-sync
          # Write the service account json content from secret to file
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          # Run the Realtime Database sync script (exactly 1 sync per day)
          node syncRatesRealtime.js
